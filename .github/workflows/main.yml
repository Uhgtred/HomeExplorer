name: Build and Test with Documentation

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ROBOT_USER }}
          password: ${{ secrets.ROBOT_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag robot_image

      # Install coverage inside the container using uv
      - name: Install coverage in Docker container
        run: docker run --rm robot_image sh -c "uv tool install coverage"

      # Run tests + generate coverage.xml inside container
      - name: Run unit tests with coverage in Docker container and extract report
        run: |
          docker run --name coverage_container robot_image sh -c "\
            uv run coverage run --rcfile=.coveragerc -m unittest discover -v && \
            uv run coverage xml --rcfile=.coveragerc -o /app/coverage.xml && \
            uv run coverage report --rcfile=.coveragerc \
          "
          docker cp coverage_container:/app/coverage.xml ./coverage.xml
          docker rm coverage_container

      - name: Upload coverage report to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: true


  docs:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install documentation tools
        run: |
          uv tool install mkdocs
          uv tool install mkdocs-material

      - name: Build documentation
        run: mkdocs build

      - name: Deploy documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/
