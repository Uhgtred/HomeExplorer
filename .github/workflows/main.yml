name: Build and Test with Documentation

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ROBOT_USER }}
          password: ${{ secrets.ROBOT_TOKEN }}


      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag robot_image

      - name: Set PATH environment variable
        run: echo "PATH=$PATH:/app/venv/bin" >> $GITHUB_ENV

      - name: Install coverage in Docker container
        run: docker run --rm robot_image sh -c "pip install coverage"

      - name: Run unit tests with coverage in Docker container and extract report
        run: |
          docker run --name coverage_container robot_image sh -c "coverage run --rcfile=.coveragerc -m unittest discover -v && coverage xml --rcfile=.coveragerc -o /app/coverage.xml && coverage report --rcfile=.coveragerc"
          docker cp coverage_container:/app/coverage.xml ./coverage.xml
          docker rm coverage_container

      - name: Upload coverage report to GitHub
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: ./coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: true


  # MKDocs documentation generation
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          pip install mkdocs
          pip install mkdocs-material

      - name: Deploy documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/
